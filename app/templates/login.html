<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Splitwise Mini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F4F5F1; --surface:#FFFFFF; --surface-2:#ECEEE7;
    --ink:#14171A; --muted:#6B7280; --border:#E1E4DD;
    --accent:#12664F; --accent-dark:#0D4C3B; --accent-soft:#E3F0EB;
    --negative:#C7442E; --negative-soft:#FBEAE6;
    --radius:18px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,23,26,0.04), 0 16px 32px -12px rgba(20,23,26,0.12);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-body); background:var(--bg); color:var(--ink); padding:24px;
    background-image: radial-gradient(circle at 20% 15%, rgba(18,102,79,0.06), transparent 45%);
  }
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:36px 32px; width:100%; max-width:400px;
  }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .brand-mark {
    width:40px; height:40px; border-radius:11px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display);
    font-weight:600; font-size:1.15rem; flex-shrink:0;
  }
  .brand-name { font-family:var(--font-display); font-weight:600; font-size:1.05rem; }
  h1 { font-family:var(--font-display); font-weight:600; font-size:1.5rem; margin:0 0 6px; letter-spacing:-0.01em; }
  p.sub { color:var(--muted); font-size:0.92rem; margin:0 0 24px; line-height:1.4; }
  label { display:block; font-size:0.8rem; font-weight:600; color:var(--ink); margin-bottom:6px; margin-top:16px; }
  label:first-of-type { margin-top:0; }
  input {
    width:100%; background:var(--bg); border:1.5px solid var(--border); color:var(--ink);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:0.98rem; font-family:inherit;
    min-height:46px; transition:border-color .15s ease, background .15s ease;
  }
  input:focus { outline:none; border-color:var(--accent); background:var(--surface); }
  button {
    width:100%; margin-top:26px; background:var(--accent); color:#fff; border:none;
    padding:13px; border-radius:var(--radius-sm); font-size:0.98rem; font-weight:600;
    cursor:pointer; min-height:46px; transition:background .15s ease, transform .05s ease;
    font-family:inherit;
  }
  button:hover { background:var(--accent-dark); }
  button:active { transform:translateY(1px); }
  .flash {
    display:flex; align-items:flex-start; gap:8px; color:#8a2f1f; background:var(--negative-soft);
    border:1px solid #f0c9bd; font-size:0.85rem; margin-top:16px; padding:10px 12px; border-radius:var(--radius-sm);
  }
  .link { display:block; text-align:center; margin-top:22px; color:var(--muted); font-size:0.88rem; text-decoration:none; }
  .link b { color:var(--accent); font-weight:600; }
  .link:hover b { text-decoration:underline; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-mark">S</div>
    <div class="brand-name">Splitwise Mini</div>
  </div>
  <h1>Welcome back</h1>
  <p class="sub">Log in to keep track of who owes what.</p>
  <form method="post">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autocomplete="username" />
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password" />
    <button type="submit">Log in</button>
  </form>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  <a class="link" href="{{ url_for('auth.register') }}">New here? <b>Create an account</b></a>
</div>
</body>
</html>
